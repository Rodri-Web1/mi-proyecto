<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t5 d5">
  <title id="t5">Balanza dividida en tres partes iguales</title>
  <desc id="d5">Balanza de tres platillos representando el reparto en tercios</desc>
  <rect width="400" height="300" fill="#0c1120"/>
  <line x1="200" y1="60" x2="200" y2="230" stroke="#aab2cf" stroke-width="4"/>
  <line x1="90" y1="100" x2="310" y2="100" stroke="#4fe0d6" stroke-width="4"/>
  <g stroke="#4fe0d6" stroke-width="2" fill="none">
    <line x1="100" y1="100" x2="80" y2="150"/>
    <line x1="120" y1="100" x2="80" y2="150"/>
    <line x1="200" y1="100" x2="180" y2="160"/>
    <line x1="220" y1="100" x2="220" y2="160"/>
    <line x1="300" y1="100" x2="320" y2="150"/>
    <line x1="280" y1="100" x2="320" y2="150"/>
  </g>
  <ellipse cx="80" cy="160" rx="38" ry="14" fill="#131b30" stroke="#ffb454" stroke-width="3"/>
  <ellipse cx="200" cy="172" rx="38" ry="14" fill="#131b30" stroke="#a78bfa" stroke-width="3"/>
  <ellipse cx="320" cy="160" rx="38" ry="14" fill="#131b30" stroke="#9df3ec" stroke-width="3"/>
  <rect x="180" y="225" width="40" height="14" fill="#aab2cf"/>
  <text x="80" y="164" font-family="Arial, sans-serif" font-size="11" fill="#ffb454" text-anchor="middle">1/3</text>
  <text x="200" y="176" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">1/3</text>
  <text x="320" y="164" font-family="Arial, sans-serif" font-size="11" fill="#9df3ec" text-anchor="middle">1/3</text>
</svg>
